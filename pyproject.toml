[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-surveillance"
version = "0.1.0"
description = "Weakly-supervised video anomaly detection (UCF-Crime, MIL) + real-time person tracking with event alerts"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["surveillance"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }   # single source of truth for pins
